[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabutil"
version = "0.1.0"
description = "A command-line utility for Microsoft Fabric and Power BI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.31,<2",
    "msal-extensions>=1.2,<2",
    "requests>=2.32,<3",
]

[project.scripts]
fabutil = "fabutil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
